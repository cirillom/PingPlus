name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Run this workflow from the default branch (${{ github.event.repository.default_branch }})." >&2
            exit 1
          fi

      - name: Calculate version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          mod="${GITHUB_REPOSITORY#*/}"
          project="src/$mod/$mod.csproj"
          plugin="src/$mod/Plugin.cs"
          mapfile -t versions < <(grep -oE '<Version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)</Version>' "$project")

          if [[ "${#versions[@]}" -ne 1 ]]; then
            echo "The project must contain exactly one X.Y.Z <Version>." >&2
            exit 1
          fi

          current="${versions[0]#<Version>}"
          current="${current%</Version>}"
          plugin_version="$(sed -nE 's/.*public const string PluginVersion = "([^"]+)";.*/\1/p' "$plugin")"
          manifest_version="$(jq -r '.version_number // empty' manifest.json)"

          if [[ "$plugin_version" != "$current" || "$manifest_version" != "$current" ]]; then
            echo "Version mismatch: project=$current plugin=$plugin_version manifest=$manifest_version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          tag="v$version"
          git rev-parse "refs/tags/$tag" >/dev/null 2>&1 && { echo "Tag $tag already exists." >&2; exit 1; }

          echo "MOD=$mod" >> "$GITHUB_ENV"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $current -> $version ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set version
        shell: bash
        run: |
          sed -Ei "s|(public const string PluginVersion = \")[^\"]+(\";)|\1$VERSION\2|" "$PLUGIN"
          sed -Ei "s|<Version>[^<]+</Version>|<Version>$VERSION</Version>|" "$PROJECT"
          jq --arg version "$VERSION" '.version_number = $version' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          grep -Fq "public const string PluginVersion = \"$VERSION\";" "$PLUGIN"
          grep -Fq "<Version>$VERSION</Version>" "$PROJECT"
          jq -e --arg version "$VERSION" '.version_number == $version' manifest.json >/dev/null
          git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build release
        run: dotnet build "$PROJECT" --configuration Release

      - name: Create ZIP
        shell: bash
        run: |
          cd dist
          zip -r "../${{ github.repository_owner }}-$MOD-$VERSION.zip" BepInEx icon.png manifest.json README.md

      - name: Commit version and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN" "$PROJECT" manifest.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "${{ github.repository_owner }}-$MOD-$VERSION.zip" --generate-notes --title "$TAG"
